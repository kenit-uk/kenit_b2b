[project]
name = "kenit-b2b"
version = "1.0.0"
description = "Kenit - Aircondition: London air-conditioning installation records"
requires-python = ">=3.12"
# requirements.txt 와 같은 목록을 유지한다 (Docker/로컬은 requirements.txt, Vercel은 이 파일을 사용)
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "boto3==1.35.99",
    "psycopg[binary]==3.2.3",
    "pillow==11.0.0",
]

[tool.vercel]
entrypoint = "app.main:app"
